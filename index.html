<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONECLICK — Better finds. Less searching.</title>
<meta name="description" content="ONECLICK — curated products, simple shopping.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ee;color:#111}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 22px}.top{background:#111;color:#fff;text-align:center;padding:9px;font-size:12px;font-weight:700;letter-spacing:.08em}.nav{height:76px;border-bottom:1px solid #ddd8cf;background:#f7f4ee;display:flex;align-items:center;position:sticky;top:0;z-index:5}.navin{display:flex;align-items:center;justify-content:space-between;width:100%}.logo{font-size:25px;font-weight:950;letter-spacing:-.07em}.logo i{font-style:normal;color:#c49a35}.links{display:flex;gap:28px;font-size:14px;font-weight:700;color:#555}.actions{display:flex;gap:8px;align-items:center}.icon,.btn{border:0;border-radius:999px;padding:11px 15px;background:#fff;cursor:pointer;font-weight:800}.cart{position:relative}.count{position:absolute;right:2px;top:1px;background:#111;color:#fff;border-radius:20px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center}.hero{margin:34px 0 60px;border-radius:34px;background:#111;color:#fff;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;min-height:540px}.heroText{padding:65px;display:flex;flex-direction:column;justify-content:center}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:900;color:#a6a6a6}.hero h1{font-size:clamp(46px,6vw,76px);line-height:.94;letter-spacing:-.065em;margin:18px 0}.hero h1 span{color:#999}.hero p{color:#ccc;max-width:500px;line-height:1.7}.primary{background:#fff;color:#111;padding:14px 20px}.heroimg{background:url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=85') center/cover;min-height:400px}.trust{border-block:1px solid #ddd8cf;background:#fff}.trustin{display:grid;grid-template-columns:repeat(3,1fr);padding:22px 0;gap:20px}.trust b{display:block;font-size:14px}.trust span{font-size:12px;color:#777}.section{padding:70px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.head h2{font-size:38px;letter-spacing:-.05em;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #e6e1d9;border-radius:22px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 16px 35px #0000000d}.pic{aspect-ratio:1;background:#eee;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:12px;left:12px;background:#111;color:#fff;border-radius:99px;padding:6px 9px;font-size:10px;font-weight:900}.info{padding:16px}.cat{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#888;font-weight:900}.name{font-weight:900;margin:6px 0 10px}.price{font-weight:950;font-size:18px}.old{font-size:12px;color:#999;text-decoration:line-through;margin-left:7px}.shopbar{display:flex;gap:12px;margin-bottom:28px}.search{flex:1;border:1px solid #ddd8cf;border-radius:999px;padding:14px 18px;background:#fff;outline:none}.select{border:1px solid #ddd8cf;border-radius:999px;padding:0 18px;background:#fff}.empty{text-align:center;padding:70px;background:#fff;border-radius:24px}.product{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:55px 0}.productimg{width:100%;border-radius:30px;aspect-ratio:1;object-fit:cover;background:#eee}.product h1{font-size:50px;line-height:1;letter-spacing:-.06em}.desc{color:#666;line-height:1.8}.buy{display:flex;gap:10px;margin-top:25px}.buy button{border:0;border-radius:12px;padding:16px 22px;cursor:pointer;font-weight:900}.buy .add{background:#111;color:#fff;flex:1}.qty{background:#fff;border:1px solid #ddd8cf;display:flex;align-items:center;border-radius:12px}.qty button{background:none!important;color:#111!important;padding:12px 16px}.cartrow{display:flex;gap:18px;background:#fff;border:1px solid #e6e1d9;border-radius:18px;padding:14px;margin:10px 0;align-items:center}.cartrow img{width:90px;height:90px;object-fit:cover;border-radius:12px}.cartrow .grow{flex:1}.remove{border:0;background:#eee;border-radius:10px;padding:9px;cursor:pointer}.checkout{max-width:760px;margin:auto;background:#fff;padding:30px;border-radius:25px}.checkout input{width:100%;padding:14px;margin:7px 0;border:1px solid #ddd8cf;border-radius:10px}.checkout button{width:100%;padding:15px;background:#111;color:#fff;border:0;border-radius:12px;font-weight:900;margin-top:12px}.footer{background:#111;color:#fff;padding:45px 0;margin-top:40px}.footerin{display:flex;justify-content:space-between;gap:20px}.muted{color:#aaa;font-size:13px}.hide{display:none!important}@media(max-width:800px){.links{display:none}.hero{grid-template-columns:1fr}.heroimg{min-height:300px;order:-1}.heroText{padding:38px}.grid{grid-template-columns:repeat(2,1fr)}.trustin{grid-template-columns:1fr}.product{grid-template-columns:1fr;gap:25px}.product h1{font-size:40px}.footerin{flex-direction:column}.shopbar{flex-direction:column}.select{padding:14px}}
</style></head>
<body>
<div class="top">FREE SHIPPING ON SELECTED ORDERS · ONECLICK</div>
<header class="nav"><div class="wrap navin"><a class="logo" href="#home">ONECLICK<span>.</span></a><nav class="links"><a href="#home">Home</a><a href="#shop">Shop</a><a href="#featured">Featured</a></nav><div class="actions"><a class="icon" href="#shop">⌕</a><a class="icon cart" href="#cart">Bag <span id="count" class="count">0</span></a></div></div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap footerin"><div><div class="logo">ONECLICK<span>.</span></div><p class="muted">Better finds. Less searching.</p></div><div class="muted">© 2026 ONECLICK. All rights reserved.</div></div></footer>
<script>
const products=[
{id:1,name:'Magnetic Phone Stand',cat:'Tech',price:499,old:899,img:'https://images.unsplash.com/photo-1586953208448-b95a79798f07?auto=format&fit=crop&w=900&q=80',desc:'A compact magnetic stand that keeps your phone visible, stable and ready for hands-free use.',featured:true},
{id:2,name:'Minimal Desk Organizer',cat:'Home',price:699,old:1199,img:'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=900&q=80',desc:'Clean up your workspace with a simple organizer designed for everyday essentials.',featured:true},
{id:3,name:'Portable LED Lamp',cat:'Home',price:899,old:1499,img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=80',desc:'A modern rechargeable lamp for desks, bedside tables and cozy corners.',featured:true},
{id:4,name:'Everyday Travel Pouch',cat:'Lifestyle',price:599,old:999,img:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=80',desc:'Keep cables, cards and small essentials organized wherever you go.',featured:true},
{id:5,name:'Wireless Mini Speaker',cat:'Tech',price:1299,old:1999,img:'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=80',desc:'Small footprint, big sound and a clean design made for everyday listening.'},
{id:6,name:'Aroma Diffuser',cat:'Wellness',price:999,old:1599,img:'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=900&q=80',desc:'Bring a calm atmosphere to your space with a sleek essential-oil diffuser.'},
{id:7,name:'Stainless Water Bottle',cat:'Lifestyle',price:799,old:1299,img:'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=900&q=80',desc:'A reusable bottle built for workdays, workouts and travel.'},
{id:8,name:'Smart Cable Kit',cat:'Tech',price:449,old:799,img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=900&q=80',desc:'A practical set for keeping your everyday charging setup neat and ready.'}
];
let cart=JSON.parse(localStorage.getItem('oneclick-cart')||'[]');
const save=()=>{localStorage.setItem('oneclick-cart',JSON.stringify(cart));updateCount()};
const updateCount=()=>document.getElementById('count').textContent=cart.reduce((a,x)=>a+x.qty,0);
const money=n=>'₹'+n.toLocaleString('en-IN');
function card(p){return `<a class="card" href="#product/${p.id}"><div class="pic"><img src="${p.img}" alt="${p.name}" loading="lazy">${p.old?'<span class="tag">SALE</span>':''}</div><div class="info"><div class="cat">${p.cat}</div><div class="name">${p.name}</div><div><span class="price">${money(p.price)}</span><span class="old">${money(p.old)}</span></div></div></a>`}
function home(){return `<div class="wrap"><section class="hero"><div class="heroText"><div class="eyebrow">The everyday edit</div><h1>Better finds.<br><span>Less searching.</span></h1><p>Discover practical, beautiful products selected for modern life — without the endless scrolling.</p><div><a class="btn primary" href="#shop">Shop the collection →</a></div></div><div class="heroimg"></div></section></div><div class="trust"><div class="wrap trustin"><div>🚚 <b>Reliable delivery</b><span>Tracking on eligible orders</span></div><div>🔒 <b>Secure checkout</b><span>Protected payment experience</span></div><div>↩️ <b>Simple support</b><span>Help when you need it</span></div></div></div><section class="section wrap" id="featured"><div class="head"><div><div class="eyebrow">Handpicked</div><h2>Featured right now</h2></div><a href="#shop"><b>View all →</b></a></div><div class="grid">${products.filter(p=>p.featured).map(card).join('')}</div></section><section class="section wrap"><div style="background:#fff;border:1px solid #e5e0d8;border-radius:28px;padding:42px"><div class="eyebrow">Why ONECLICK</div><h2 style="font-size:38px;letter-spacing:-.05em">A store designed around what you actually need.</h2><p class="desc">Useful products. Clear pricing. A calm buying experience. No clutter and no unnecessary noise.</p></div></section>`}
function shop(){let q='';return `<section class="section wrap"><div class="head"><div><div class="eyebrow">Collection</div><h2>Shop all products</h2></div></div><div class="shopbar"><input id="search" class="search" placeholder="Search products..."><select id="cat" class="select"><option>All categories</option>${[...new Set(products.map(p=>p.cat))].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="results" class="grid">${products.map(card).join('')}</div></section>`}
function product(id){let p=products.find(x=>x.id==id);if(!p)return '<div class="wrap section empty">Product not found.<br><br><a class="btn" href="#shop">Back to shop</a></div>';return `<section class="wrap product"><img class="productimg" src="${p.img}" alt="${p.name}"><div><div class="eyebrow">${p.cat}</div><h1>${p.name}</h1><div><span class="price" style="font-size:28px">${money(p.price)}</span><span class="old">${money(p.old)}</span></div><p class="desc">${p.desc}</p><div class="buy"><div class="qty"><button onclick="changeQty(-1)">−</button><b id="pq">1</b><button onclick="changeQty(1)">+</button></div><button class="add" onclick="add(${p.id})">Add to cart</button></div><p class="muted">✓ Secure checkout · ✓ Order support</p></div></section>`}
let pq=1;function changeQty(n){pq=Math.max(1,pq+n);document.getElementById('pq').textContent=pq}function add(id,qty=pq){let x=cart.find(i=>i.id==id);if(x)x.qty+=qty;else cart.push({id,qty});save();location.hash='#cart'}
function cartPage(){if(!cart.length)return `<section class="section wrap empty"><h2>Your bag is empty</h2><p class="muted">Find something you love and add it here.</p><a class="btn" href="#shop">Continue shopping</a></section>`;let total=cart.reduce((s,i)=>s+products.find(p=>p.id==i.id).price*i.qty,0);return `<section class="section wrap"><div class="head"><div><div class="eyebrow">Your bag</div><h2>Shopping cart</h2></div></div>${cart.map(i=>{let p=products.find(x=>x.id==i.id);return `<div class="cartrow"><img src="${p.img}"><div class="grow"><b>${p.name}</b><div class="muted">${money(p.price)} · Qty ${i.qty}</div></div><button class="remove" onclick="removeItem(${p.id})">Remove</button></div>`}).join('')}<div style="text-align:right;margin-top:25px"><div class="muted">Total</div><div class="price" style="font-size:28px">${money(total)}</div><a class="btn primary" style="display:inline-block;margin-top:15px" href="#checkout">Proceed to checkout</a></div></section>`}
function removeItem(id){cart=cart.filter(x=>x.id!=id);save();render()}
function checkout(){let total=cart.reduce((s,i)=>s+products.find(p=>p.id==i.id).price*i.qty,0);return `<section class="section wrap"><div class="checkout"><div class="eyebrow">Checkout</div><h2>Complete your order</h2><p class="muted">Order total: <b>${money(total)}</b></p><input placeholder="Full name"><input placeholder="Email address" type="email"><input placeholder="Phone number"><input placeholder="Delivery address"><input placeholder="City"><input placeholder="PIN code"><button onclick="alert('Checkout foundation is ready. Connect Razorpay and your backend before accepting live payments.');">Place order</button></div></section>`}
function render(){let h=location.hash||'#home',app=document.getElementById('app');if(h=='#home'||h=='#')app.innerHTML=home();else if(h=='#shop')app.innerHTML=shop();else if(h=='#cart')app.innerHTML=cartPage();else if(h=='#checkout')app.innerHTML=checkout();else if(h.startsWith('#product/'))app.innerHTML=product(h.split('/')[1]);updateCount();let s=document.getElementById('search'),c=document.getElementById('cat');if(s){const filter=()=>{let q=s.value.toLowerCase(),cat=c.value;document.getElementById('results').innerHTML=products.filter(p=>(p.name+p.cat).toLowerCase().includes(q)&&(cat=='All categories'||p.cat==cat)).map(card).join('')};s.oninput=filter;c.onchange=filter}}
window.onhashchange=render;render();
</script></body></html>
